[project]
name = "mail-probe"
version = "0.1.0"
description = "Weekly end-to-end probe for the jobs@garrettmanley.dev Cloudflare Email Routing forward."
requires-python = ">=3.12"
dependencies = [
    "truststore>=0.10",  # uv-managed CPython lacks the Windows CA store
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
